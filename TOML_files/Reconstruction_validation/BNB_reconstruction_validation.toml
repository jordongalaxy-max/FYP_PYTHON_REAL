[general]
output = "/exp/icarus/data/users/jkoh1/BNB_reconstruction_validation"
primfn = "default_primary_classification"
pidfn = "default_pid"

fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

recopi0thresh = [
    "@photon_threshold",
    "@leading_photon_threshold",
]

[parameters]
photon_threshold = 25.0
electron_threshold = 0.0
muon_threshold = 143.425
pi0_threshold = 0.0
pion_threshold = 25.0
proton_threshold = 0.0
leading_photon_threshold = 25.0
pi0_mass_veto_low = 60.0
pi0_mass_veto_high = 300.0
flash_low_t = -0.5
flash_high_t = 1.6
bnb_fom2_cut = 0.98


[[sample]]
name = "BNB_SIMULATION"
path = "/pnfs/icarus/persistent/users/mueller/production/simulation/nominal/input*.flat.root"
ismc = true
disable = false

[[tree]] # Interaction level data
name = "interaction_level"
sim_only = true
add_exposure = true
mode = "reco"
cut = [
    {name = "no_cut",          type = "reco" },
]
branch = [
    #Multiplicity tests and interaction level
    {name = "photon_multiplicity",   type = "both", parameters = [ "@photon_threshold"   ]},
    {name = "electron_multiplicity", type = "both", parameters = [ "@electron_threshold" ]},
    {name = "muon_multiplicity",     type = "both", parameters = [ "@muon_threshold"     ]},
    {name = "pion_multiplicity",     type = "both", parameters = [ "@pion_threshold"     ]},
    {name = "proton_multiplicity",   type = "both", parameters = [ "@proton_threshold"   ]},
    {name = "vertex_x",              type = "both"    },
    {name = "vertex_y",              type = "both"    },
    {name = "vertex_z",              type = "both"    },
    {name = "neutrino_id", type = "true"},
    {name = "pdg", type = "mctruth"},
    {name = "cc", type = "mctruth"},
    {name = "neutrino_energy", type = "mctruth"},
    {name = "neutrino_Q2", type = "mctruth"},
    {name = "neutrino_W", type = "mctruth"},
    {name = "interaction_mode", type = "mctruth"},
    {name = "interaction_type", type = "mctruth"},
    {name = "visible_energy", type = "both"},
    #Muon observables
    {name = "length", type = "both_particle", selector = "muon"},
    {name = "p", type = "reco_particle", selector = "muon"},
    {name = "ke", type = "both_particle", selector = "muon"},
    {name = "beam_costheta", type = "reco_particle", selector = "muon"},
    {name = "muon_p", type = "mctruth", parameters = ["@muon_threshold"]},
    {name = "muon_beam_costheta", type = "mctruth", parameters = ["@muon_threshold"]},
]

[[tree]] # event level data
name = "event_level"
sim_only = true
mode = "event"
cut = [
    {name = "no_cut", type = "event"},
]
branch = [
    {name = "nnu", type = "event"},
    {name = "ntrue", type = "event"},
    {name = "nreco", type = "event"},
    {name = "pot", type = "event"},
    {name = "nintime", type = "event", parameters = [-0.5, 1.6]},
]
